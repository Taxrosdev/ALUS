[package]
name = "alus"
authors = [ "Taxrosdev" ]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
default-run = "alus"

[dependencies]
bytes = "1.12"
async-recursion = "1"
async-trait = "0.1"
blake3 = "1.8"
clap = { version = "^4.6", features = ["derive"] }
console = "0.16"
indicatif = "0.18"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "fs", "rt-multi-thread"] }
nix = { version = "0.31", features = ["fs", "mount", "process", "sched"] }
toml = "1.1.3"
dialoguer = "0.12.0"
treeup = { git = "https://github.com/taxrosdev/treeup", version = "0.1.0" }
hex = "0.4"
futures-util = "0.3"
ahash = "0.8"
dashmap = "6"
