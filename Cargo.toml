[workspace]
resolver = "3"
members = [".", "utils"]

[package]
name = "alus"
authors = [ "Taxrosdev" ]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"
default-run = "alus"

[workspace.dependencies]
async-trait = "0.1"
blake3 = "^1.8.5"
bytes = "1.12.1"
futures-core = "0.3"
nix = { version = "0.31", features = ["fs"] }
reqwest = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "^1.53"
tokio-stream = "0.1.19"

[dependencies]
bytes.workspace = true
async-recursion = "1"
async-trait.workspace = true
blake3.workspace = true
clap = { version = "^4.6", features = ["derive"] }
console = "0.16"
indicatif = "0.18"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }
utils = { path = "./utils" }
nix = { workspace = true, features = ["fs", "mount", "process", "sched"] }
toml = "1.1.3"
dialoguer = "0.12.0"
treeup = { git = "https://github.com/taxrosdev/treeup", version = "0.1.0" }
hex = "0.4.3"
futures-util = "0.3.34"
